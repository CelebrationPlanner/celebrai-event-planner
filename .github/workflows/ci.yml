# Runs on every push and pull request to main: static checks and unit tests, plus the integration
# and end-to-end suites against a local Supabase stack (Docker) started on the runner.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Placeholder local values only; tests use mocks and an in-memory backend.
      - run: cp client/.env.example client/.env && cp server/.env.example server/.env
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  integration-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Auth, API gateway, PostgREST and mail are all the app needs; skip the rest to start faster.
      - run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Point the app at the runner's local stack (its default local keys, not real credentials).
      - run: |
          npx supabase status -o json | node -e "
            const fs = require('fs')
            const s = JSON.parse(fs.readFileSync(0, 'utf8'))
            const key = s.ANON_KEY ?? s.PUBLISHABLE_KEY
            fs.writeFileSync('server/.env', 'SUPABASE_URL=' + s.API_URL + '\nSUPABASE_ANON_KEY=' + key + '\nCLIENT_URL=http://localhost:5175\n')
            fs.writeFileSync('client/.env', 'VITE_SUPABASE_URL=' + s.API_URL + '\nVITE_SUPABASE_ANON_KEY=' + key + '\n')
          "
      - run: npm run test:integration -w server
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:e2e -w client
