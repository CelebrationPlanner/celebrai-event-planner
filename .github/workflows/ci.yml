# Runs on every push and pull request to main. Integration and end-to-end tests need a local
# Supabase stack (Docker) and run locally: `npm run test:integration -w server`, `npm run test:e2e -w client`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Placeholder local values only; tests use mocks and an in-memory backend.
      - run: cp client/.env.example client/.env && cp server/.env.example server/.env
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
