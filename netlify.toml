# Frontend (Vite SPA) on Netlify. The API runs on Render (see render.yaml) because full AI
# plan generation takes ~40 s, beyond synchronous serverless function limits.
[build]
  command = "npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing: only the app's routes load the app (static files such as robots.txt are
# served first). Any other path gets 404.html with a real 404 status, not a copy of the home page.
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/planner"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/settings"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/events/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# App screens are private or thin: keep them out of search results.
[[headers]]
  for = "/login"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/signup"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/dashboard"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/planner"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/settings"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/events/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
